name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      # Workflows use the action as @v1 or @v1.2, so those tags follow the newest release.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - name: Move the major and minor tags
        if: ${{ steps.release.outputs.release_created }}
        env:
          SHA: ${{ steps.release.outputs.sha }}
          MAJOR: v${{ steps.release.outputs.major }}
          MINOR: v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
        run: |
          git config --local user.email 'actions@github.com'
          git config --local user.name 'github-actions[bot]'
          git tag -fa "$MAJOR" -m "Update $MAJOR tag" "$SHA"
          git tag -fa "$MINOR" -m "Update $MINOR tag" "$SHA"
          git push --force origin "$MAJOR" "$MINOR"

      # release-please opens and updates its PR with GITHUB_TOKEN, and events from
      # that token do not trigger pull_request workflows. GITHUB_TOKEN may trigger
      # workflow_dispatch, so dispatch the required check on the release branch.
      # The result attaches to the PR's head commit under the same check name.
      # jq, not fromJSON: GitHub evaluated fromJSON of an empty pr output on a
      # release run and failed the step. This step is last, so it never blocks the tags.
      - name: Run the tests on the release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r .headBranchName <<< "$PR")
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
